name: contracts-lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Lint skill contracts
        run: python3 scripts/lint-contracts.py
      - name: Test the linter
        run: python3 -m unittest discover -s tests/contracts -v

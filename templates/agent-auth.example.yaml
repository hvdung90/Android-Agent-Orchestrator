# agent-auth.example.yaml
# Template for the Android Agent Orchestrator auth file.
#
# THIS FILE:  templates/agent-auth.example.yaml  (committed, no secrets)
# REAL FILE:  .agent-auth.yaml                   (gitignored, auto-created when the skill first runs)
#
# Do not copy this file manually. The skill will create .agent-auth.yaml if it is missing.
# Tokens are requested when the corresponding tool needs them.
#
# Ref: refs/auth-bootstrap.md
# ─────────────────────────────────────────────────────────────────────────────

# ══════════════════════════════════════════════════════════════
# LEVEL 1 — Workspace
# ══════════════════════════════════════════════════════════════
workspace:
  name: ""                   # Team / company name (used as a label in reports)
  default_jira_project: ""   # Default prefix, e.g. "ANDROID"

# ══════════════════════════════════════════════════════════════
# LEVEL 2 — Tool credentials (default, used when there is no project override)
# ══════════════════════════════════════════════════════════════

# ── Atlassian — Jira + Confluence share one token ──────────
# MCP: mcp__claude_ai_Atlassian__*
atlassian:
  domain: ""          # e.g. mycompany.atlassian.net  (without https://)
  email: ""           # Atlassian login email
  api_token: ""       # https://id.atlassian.com/manage-profile/security/api-tokens
                      # → Create API token → Copy

# ── Figma ──────────────────────────────────────────────────────
# API: Figma REST API (personal access token)
figma:
  personal_access_token: ""
  # Figma → Account Settings → Security → Personal access tokens
  # → Generate new token → Permissions: File content (read-only) → Copy

# ── GitHub (optional) ──────────────────────────────────────────
# MCP: mcp__plugin_everything-claude-code_github__*
github:
  personal_access_token: ""
  # GitHub → Settings → Developer settings → Personal access tokens → Fine-grained
  # → Permissions: Contents (read-only), Metadata (read-only) → Generate → Copy

# ══════════════════════════════════════════════════════════════
# LEVEL 3 — Per-project overrides (optional)
# Use when working with multiple Atlassian instances or different Figma accounts.
# Each project fully overrides LEVEL 2 for its matching ticket prefix.
# Fields that are not declared fall back to LEVEL 2.
# ══════════════════════════════════════════════════════════════
projects: []

# Example:
#
# projects:
#   - name: "client-alpha"
#     jira_project_key: "CA"        # agent matches prefix "CA-42" → uses this block
#     atlassian:
#       domain: "client-alpha.atlassian.net"
#       email: "contractor@client-alpha.com"
#       api_token: ""               # leave empty → agent asks when needed
#     figma:
#       personal_access_token: ""   # leave empty → agent asks when needed
#
#   - name: "internal-platform"
#     jira_project_key: "PLAT"
#     atlassian:
#       domain: "mycompany.atlassian.net"
#       email: "dev@mycompany.com"
#       api_token: ""
#     # figma is not declared → use LEVEL 2
